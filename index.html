<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1c2230;
      --border: #21262d;
      --border-subtle: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --text-dim: #484f58;
      --accent: #58a6ff;
      --accent-dim: #1f3352;
      --tag-bg: #21262d;
      --tag-text: #8b949e;
      --folder-color: #c9a22e;
      --skill-color: #58a6ff;
      --series-0: #58a6ff;
      --series-1: #484f58;
      --series-2: #d29922;
      --sidebar-width: 280px;
      --font-mono: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
      --font-sans: -apple-system, "Segoe UI", system-ui, sans-serif;
    }

    /* ── Light theme (Finder palette) ── */
    :root.light {
      --bg: #ffffff;
      --surface: #e8e8e8;
      --surface-hover: #d0d0d0;
      --border: #c8c8c8;
      --border-subtle: #d4d4d4;
      --text: #1c1c1e;
      --text-muted: #3c3c3e;
      --text-dim: #6c6c70;
      --accent: #007aff;
      --accent-dim: #ddeeff;
      --tag-bg: #efefef;
      --tag-text: #3c3c3e;
      --folder-color: #007aff;
      --skill-color: #007aff;
      --series-0: #007aff;
      --series-1: #b4b4b9;
      --series-2: #d97c14;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ── TOC pane ── */
    #toc-pane {
      width: 180px;
      min-width: 180px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      background: var(--bg);
      overflow-y: auto;
      padding: 48px 20px 48px 20px;
      display: none; /* hidden until a project is open */
    }

    #toc-pane::-webkit-scrollbar { width: 3px; }
    #toc-pane::-webkit-scrollbar-track { background: transparent; }
    #toc-pane::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 2px; }

    .toc-label {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc-item {
      margin-bottom: 10px;
    }

    .toc-item a {
      font-size: 12.5px;
      color: var(--text-muted);
      text-decoration: none;
      line-height: 1.45;
      display: block;
      transition: color 0.12s;
    }

    .toc-item a:hover { color: var(--text); }

    .toc-item.toc-h3 a {
      padding-left: 12px;
      border-left: 2px solid var(--border-subtle);
      font-size: 11.5px;
    }

    .toc-item.active > a {
      color: var(--accent);
    }

    .toc-item.toc-h3.active > a {
      border-left-color: var(--accent);
    }

    /* ── Sidebar ── */
    #sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Mobile top bar ── */
    #mobile-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #hamburger {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    #hamburger svg { width: 20px; height: 20px; }

    #mobile-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    #mobile-theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    #mobile-theme-toggle svg { width: 18px; height: 18px; }

    /* ── Mobile back button (inside content pane) ── */
    #back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--accent);
      font-family: var(--font-sans);
      padding: 0;
      margin-bottom: 28px;
    }

    #back-btn svg { width: 16px; height: 16px; }

    /* ── Overlay (mobile drawer backdrop) ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 99;
    }

    #overlay.visible { display: block; }

    #sidebar-header {
      padding: 20px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header .name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    #sidebar-header .role {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    #sidebar-search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-search input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--text);
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s;
    }

    #sidebar-search input::placeholder { color: var(--text-dim); }
    #sidebar-search input:focus { border-color: var(--accent); }

    #tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    #tree::-webkit-scrollbar { width: 4px; }
    #tree::-webkit-scrollbar-track { background: transparent; }
    #tree::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 2px; }

    /* ── Tree nodes ── */
    .tree-folder, .tree-file {
      user-select: none;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.1s;
      white-space: nowrap;
      overflow: hidden;
    }

    .tree-row:hover { background: var(--surface-hover); }
    .tree-row.active { background: var(--accent-dim); color: var(--accent); }
    .tree-row.active .tree-label { color: var(--accent); }

    .tree-indent { display: flex; align-items: center; }

    .tree-chevron {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--text-dim);
      transition: transform 0.15s;
    }

    .tree-chevron.open { transform: rotate(90deg); }
    .tree-chevron-placeholder { width: 14px; flex-shrink: 0; }

    .tree-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .tree-icon.folder { color: var(--folder-color); }
    .tree-icon.file { color: var(--text-dim); }
    .tree-icon--skill { color: var(--skill-color); }
    .tree-row.active .tree-icon { color: var(--accent); }

    .tree-label {
      font-size: 12.5px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-mono);
    }

    .tree-children { display: none; }
    .tree-children.open { display: block; }

    /* ── Content pane ── */
    #content {
      flex: 1;
      overflow-y: auto;
      padding: 48px 60px;
      background: var(--bg);
      min-width: 0;
    }

    /* When TOC is visible, tighten content right padding */
    #app.has-toc #content {
      padding-right: 40px;
    }

    #content::-webkit-scrollbar { width: 6px; }
    #content::-webkit-scrollbar-track { background: transparent; }
    #content::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }

    /* ── Welcome state ── */
    #welcome {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      max-width: 560px;
    }

    #welcome .welcome-label {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    #welcome h1 {
      font-size: 32px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 12px;
    }

    #welcome p {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    #welcome .hint {
      margin-top: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    #welcome .hint-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-dim);
    }

    /* ── Featured work (welcome state) ── */
    #featured {
      width: 100%;
      margin-top: 40px;
    }

    #featured:empty { display: none; }

    #featured .welcome-label { margin-bottom: 12px; }

    .featured-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .featured-card {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      cursor: pointer;
      font-family: var(--font-sans);
      color: inherit;
    }

    .featured-card:hover {
      background: var(--surface-hover);
      border-color: var(--border-subtle);
    }

    .featured-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .featured-path {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .featured-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }

    .featured-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 2px;
    }

    .featured-impact {
      margin-top: 10px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--accent);
    }

    /* ── Project page ── */
    #project-view { display: none; max-width: 680px; }

    .project-breadcrumb {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      margin-bottom: 28px;
      letter-spacing: 0.04em;
    }

    .project-breadcrumb span { color: var(--text-dim); }
    .project-breadcrumb .crumb-sep { margin: 0 6px; }

    .project-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .project-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 36px;
    }

    .project-tag {
      font-size: 11px;
      font-family: var(--font-mono);
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 3px 9px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
    }

    .project-divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 32px;
    }

    /* ── Project body (markdown-rendered) ── */
    .project-body {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .project-body h2 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      margin: 36px 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .project-body h2:first-child { margin-top: 0; }

    .project-body h3 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin: 24px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: var(--font-mono);
    }

    .project-body p {
      margin-bottom: 16px;
    }

    .project-body p:last-child { margin-bottom: 0; }

    .project-body strong { color: var(--text); font-weight: 600; }
    .project-body em { font-style: italic; }
    .project-body a { color: var(--accent); text-underline-offset: 2px; }

    /* ── Callout block (> blockquote) ── */
    .project-body blockquote {
      margin: 24px 0;
      padding: 14px 18px;
      background: var(--accent-dim);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .project-body blockquote strong { color: var(--accent); }

    /* ── Unordered list (top-level) ── */
    .project-body ul {
      margin: 0 0 16px 0;
      padding-left: 0;
      list-style: none;
    }

    .project-body ul li {
      position: relative;
      padding-left: 16px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .project-body ul li::before {
      content: '–';
      position: absolute;
      left: 0;
      color: var(--text-dim);
    }

    /* nested list */
    .project-body ul ul {
      margin: 6px 0 6px 0;
    }

    .project-body ul ul li::before {
      content: '·';
      color: var(--text-dim);
    }

    /* ── Carousel ── */
    .project-carousel {
      margin-top: 40px;
      position: relative;
    }

    .carousel-track-wrap {
      position: relative;
      width: 100%;
      /* fixed aspect ratio — prevents reflow when switching images */
      aspect-ratio: 16 / 9;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .carousel-slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .carousel-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .carousel-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
    }

    /* prev / next arrows */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.45);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: background 0.15s;
    }

    .carousel-btn:hover { background: rgba(0,0,0,0.7); }
    .carousel-btn svg { width: 16px; height: 16px; }
    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    /* dot indicators */
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 12px;
    }

    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border-subtle);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s, transform 0.15s;
    }

    .carousel-dot.active {
      background: var(--accent);
      transform: scale(1.3);
    }

    /* counter label */
    .carousel-counter {
      text-align: center;
      margin-top: 8px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
    }

    /* ── Code block ── */
    .project-body pre {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text);
      overflow-x: auto;
      margin-bottom: 16px;
      white-space: pre;
    }

    .project-body code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      color: var(--accent);
    }

    .project-body pre code {
      background: none;
      border: none;
      padding: 0;
      color: var(--text);
      font-size: 13px;
    }

    /* ── Ordered list ── */
    .project-body ol {
      margin: 0 0 16px 0;
      padding-left: 20px;
      list-style: decimal;
    }

    .project-body ol li {
      margin-bottom: 8px;
      color: var(--text-muted);
      padding-left: 4px;
    }

    /* ── Table ── */
    .project-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 13.5px;
    }

    .project-body th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
    }

    .project-body td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      vertical-align: top;
    }

    .project-body tr:last-child td {
      border-bottom: none;
    }

    /* Wrapped code block (```wrap) for long prose like prompts */
    .project-body pre.pre-wrap {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Rich blocks (```stats, ```bars, ```compare in markdown) ── */
    .rb-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin: 4px 0 24px;
    }

    .rb-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .rb-label-mono {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }

    .rb-stat-value {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
      margin: 6px 0 4px;
      font-variant-numeric: tabular-nums;
    }

    .rb-stat-note {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .rb-bars {
      margin: 4px 0 24px;
      padding: 14px 16px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .rb-caption {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 10px;
    }

    .rb-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .rb-legend span { display: inline-flex; align-items: center; gap: 6px; }

    .rb-key {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .rb-key.s0, .rb-seg.s0 { background: var(--series-0); }
    .rb-key.s1, .rb-seg.s1 { background: var(--series-1); }
    .rb-key.s2, .rb-seg.s2 { background: var(--series-2); }

    .rb-row {
      display: grid;
      grid-template-columns: minmax(0, 10.5rem) minmax(60px, 1fr) max-content 2.25rem;
      gap: 10px;
      align-items: center;
      padding: 4px 0;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .rb-row.no-net { grid-template-columns: minmax(0, 10.5rem) minmax(60px, 1fr) max-content; }

    .rb-row.rb-head {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding-bottom: 2px;
    }

    .rb-name em {
      font-style: normal;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    .rb-bar { display: flex; gap: 2px; height: 12px; }
    .rb-seg { border-radius: 2px; min-width: 2px; }
    .rb-seg:hover { filter: brightness(1.15); }

    .rb-num {
      text-align: right;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .rb-net { color: var(--text); }

    .rb-large .rb-bar { height: 28px; }

    .rb-large-labels {
      display: flex;
      gap: 2px;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .rb-large-labels div { min-width: 0; }

    .rb-large-labels b {
      display: block;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .rb-compare {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin: 4px 0 24px;
    }

    .rb-compare-head {
      background: var(--surface);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .rb-prompt {
      margin-top: 4px;
      font-size: 14px;
      font-style: italic;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .rb-answers { display: grid; grid-template-columns: 1fr 1fr; }

    .rb-answer {
      padding: 12px 16px;
      min-width: 0;
      font-size: 13.5px;
      line-height: 1.7;
    }

    .rb-answer + .rb-answer { border-left: 1px solid var(--border); }

    .rb-who {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .rb-who strong { color: var(--text); font-weight: 600; }

    .rb-pick {
      font-size: 10.5px;
      font-family: var(--font-mono);
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 1px 8px;
    }

    .rb-compare-note {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text-dim);
    }

    /* legacy static images fallback */
    .project-images {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .project-images img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* ── Script block ── */
    .project-script-wrap {
      margin-top: 40px;
    }

    .project-script-label {
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .project-script {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      height: 240px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-muted);
      white-space: pre-wrap;
      font-family: var(--font-sans);
      resize: vertical;
    }

    .project-script::-webkit-scrollbar { width: 4px; }
    .project-script::-webkit-scrollbar-track { background: transparent; }
    .project-script::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 2px; }

    /* ── Skill badge ── */
    .skill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-dim);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--accent);
      margin-bottom: 28px;
    }

    .skill-badge svg {
      width: 12px;
      height: 12px;
    }

    /* ── Resize handle ── */
    #resize-handle {
      width: 4px;
      background: transparent;
      cursor: col-resize;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #resize-handle:hover, #resize-handle.dragging { background: var(--accent); }

    /* ── Tablet (600–767px) ── */
    @media (max-width: 767px) and (min-width: 600px) {
      :root { --sidebar-width: 220px; }
      #content { padding: 36px 32px; }
      #app.has-toc #content { padding-right: 32px; }
      .project-title { font-size: 22px; }
      #toc-pane { width: 150px; min-width: 150px; padding: 48px 14px; }
    }

    /* ── Narrow desktop / large tablet: hide TOC below 900px ── */
    @media (max-width: 899px) {
      #toc-pane { display: none !important; }
      #app.has-toc #content { padding-right: 60px; }
    }

    /* ── Mobile (< 600px) ── */
    @media (max-width: 599px) {
      html, body { overflow: auto; }

      #app {
        flex-direction: column;
        height: 100%;
        min-height: 100vh;
      }

      /* Show mobile top bar */
      #mobile-bar { display: flex; }

      /* Sidebar becomes a fixed drawer */
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        width: 280px;
        min-width: 280px;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }

      #sidebar.open {
        transform: translateX(0);
      }

      /* Hide resize handle on mobile */
      #resize-handle { display: none; }

      /* Hide desktop theme toggle — mobile bar has its own */
      #theme-toggle { display: none; }

      /* Content pane fills full screen */
      #content {
        flex: 1;
        padding: 24px 20px;
        overflow-y: auto;
        height: calc(100vh - 45px);
      }

      /* Show back button inside project view */
      #back-btn { display: flex; }

      /* Scale down typography */
      .project-title { font-size: 22px; }
      #welcome h1 { font-size: 24px; }

      /* Hint arrow points up on mobile (sidebar is above) */
      .hint-arrow { transform: rotate(90deg); }

      /* Rich blocks stack on narrow screens */
      .rb-row, .rb-row.no-net { grid-template-columns: minmax(0, 1fr) auto auto; row-gap: 4px; }
      .rb-row .rb-name { grid-column: 1 / -1; }
      .rb-row.rb-head { display: none; }
      .rb-answers { grid-template-columns: 1fr; }
      .rb-answer + .rb-answer { border-left: 0; border-top: 1px solid var(--border); }
    }

    /* ── No results ── */
    .no-results {
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    /* ── Theme toggle button ── */
    #theme-toggle {
      background: none;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      cursor: pointer;
      padding: 4px 6px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    #theme-toggle:hover {
      color: var(--text);
      border-color: var(--text-muted);
      background: var(--surface-hover);
    }

    #theme-toggle svg {
      width: 14px;
      height: 14px;
      display: block;
    }

    /* transition all color vars smoothly */
    *, *::before, *::after {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease;
    }
  </style>
</head>
<body>
<div id="overlay"></div>
<div id="app">
  <!-- Mobile top bar (hidden on desktop) -->
  <div id="mobile-bar">
    <button id="hamburger" aria-label="Open navigation">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <span class="mobile-title" id="mobile-title-text">Portfolio</span>
    <button id="mobile-theme-toggle" aria-label="Toggle theme">
      <!-- icon injected by JS -->
    </button>
  </div>

  <nav id="sidebar">
    <div id="sidebar-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
      <div>
        <div class="name" id="meta-name">—</div>
        <div class="role" id="meta-title">—</div>
      </div>
      <button id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
        <!-- icon injected by JS -->
      </button>
    </div>
    <div id="sidebar-search">
      <input type="text" id="search-input" placeholder="Search files..." autocomplete="off" spellcheck="false" />
    </div>
    <div id="tree"></div>
  </nav>

  <div id="resize-handle"></div>

  <main id="content">
    <div id="welcome">
      <div class="welcome-label">Portfolio</div>
      <h1 id="welcome-name">—</h1>
      <p id="welcome-tagline">—</p>
      <div id="featured"></div>
      <div class="hint">
        <svg class="hint-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Or select a file to browse all projects
      </div>
    </div>

    <div id="project-view">
      <button id="back-btn" aria-label="Back to file list">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        All projects
      </button>
      <div class="project-breadcrumb" id="project-breadcrumb"></div>
      <div id="skill-badge-container"></div>
      <h1 class="project-title" id="project-title"></h1>
      <p class="project-subtitle" id="project-subtitle"></p>
      <div class="project-tags" id="project-tags"></div>
      <div class="project-divider"></div>
      <div class="project-body" id="project-body"></div>
      <div id="project-script-container"></div>
      <div class="project-images" id="project-images"></div>
      <div class="project-body" id="project-body-after" style="margin-top:32px;"></div>
      <div id="project-sections"></div>
    </div>
  </main>

  <!-- TOC pane (right rail) -->
  <aside id="toc-pane">
    <div class="toc-label">On this page</div>
    <ul class="toc-list" id="toc-list"></ul>
  </aside>
</div>

<script>
// ─── Load spec ───────────────────────────────────────────────────────────────
async function loadSpec() {
  try {
    const res = await fetch('spec.json');
    if (!res.ok) throw new Error('spec.json not found');
    return await res.json();
  } catch (e) {
    console.error('Failed to load spec.json:', e);
    return null;
  }
}

// ─── State ───────────────────────────────────────────────────────────────────
let spec = null;
let activeFileId = null;
let openFolders = new Set();
let allFiles = []; // flat list for search

// ─── SVG icons ───────────────────────────────────────────────────────────────
const ICONS = {
  chevron: `<svg class="tree-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>`,
  folder: `<svg class="tree-icon folder" viewBox="0 0 24 24" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>`,
  file: `<svg class="tree-icon file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>`,
  skill: `<svg class="tree-icon tree-icon--skill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>`,
};

// ─── Flatten tree for search ──────────────────────────────────────────────────
function flattenTree(nodes, breadcrumb = [], folderIds = []) {
  nodes.forEach(node => {
    if (node.type === 'file') {
      allFiles.push({ ...node, breadcrumb: [...breadcrumb], folderIds: [...folderIds] });
    } else if (node.type === 'folder' && node.children) {
      flattenTree(node.children, [...breadcrumb, node.label], [...folderIds, node.id]);
    }
  });
}

// ─── Featured work (welcome state) ───────────────────────────────────────────
function renderFeatured(featured) {
  const container = document.getElementById('featured');
  const items = (featured || [])
    .map(f => ({ ...f, file: allFiles.find(file => file.id === f.id) }))
    .filter(f => f.file);
  if (items.length === 0) return;

  const label = document.createElement('div');
  label.className = 'welcome-label';
  label.textContent = 'Featured work';

  const list = document.createElement('div');
  list.className = 'featured-list';

  items.forEach(({ file, impact }) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'featured-card';

    const path = document.createElement('div');
    path.className = 'featured-path';
    path.textContent = file.breadcrumb.join(' / ');

    const title = document.createElement('div');
    title.className = 'featured-title';
    title.textContent = file.content.title;

    const subtitle = document.createElement('div');
    subtitle.className = 'featured-subtitle';
    subtitle.textContent = file.content.subtitle;

    card.append(path, title, subtitle);

    if (impact) {
      const impactEl = document.createElement('div');
      impactEl.className = 'featured-impact';
      impactEl.textContent = impact;
      card.appendChild(impactEl);
    }

    card.addEventListener('click', () => {
      const hidden = file.folderIds.some(id => !openFolders.has(id));
      if (hidden && !document.getElementById('search-input').value.trim()) {
        file.folderIds.forEach(id => openFolders.add(id));
        rebuildTree(spec.tree);
      }
      openFile(file.id);
    });

    list.appendChild(card);
  });

  container.append(label, list);
}

// ─── Render tree ─────────────────────────────────────────────────────────────
function renderTree(nodes, depth = 0, parentIsSkills = false) {
  const container = document.createDocumentFragment();

  nodes.forEach(node => {
    const isSkillsFolder = node.id === 'skills';
    const isSkillFile = parentIsSkills || (node.id && node.id.startsWith('skill-'));

    if (node.type === 'folder') {
      const folderEl = document.createElement('div');
      folderEl.className = 'tree-folder';
      folderEl.dataset.id = node.id;

      const isOpen = openFolders.has(node.id);

      const row = document.createElement('div');
      row.className = 'tree-row';
      row.style.paddingLeft = `${12 + depth * 16}px`;
      row.innerHTML = `
        <span class="tree-chevron ${isOpen ? 'open' : ''}">${ICONS.chevron.match(/>(.*)</s)?.[1] ? '' : ''}</span>
        ${ICONS.folder}
        <span class="tree-label">${node.label}</span>
      `;
      // Re-render chevron properly
      const chevronSpan = document.createElement('span');
      chevronSpan.innerHTML = ICONS.chevron;
      const chevronSvg = chevronSpan.querySelector('svg');
      if (isOpen) chevronSvg.classList.add('open');
      row.innerHTML = '';
      row.appendChild(chevronSvg);
      row.insertAdjacentHTML('beforeend', ICONS.folder);
      const label = document.createElement('span');
      label.className = 'tree-label';
      label.textContent = node.label;
      row.appendChild(label);

      const children = document.createElement('div');
      children.className = `tree-children ${isOpen ? 'open' : ''}`;
      if (node.children) {
        children.appendChild(renderTree(node.children, depth + 1, isSkillsFolder));
      }

      row.addEventListener('click', () => {
        const open = openFolders.has(node.id);
        if (open) {
          openFolders.delete(node.id);
          chevronSvg.classList.remove('open');
          children.classList.remove('open');
        } else {
          openFolders.add(node.id);
          chevronSvg.classList.add('open');
          children.classList.add('open');
        }
      });

      folderEl.appendChild(row);
      folderEl.appendChild(children);
      container.appendChild(folderEl);

    } else if (node.type === 'file') {
      const fileEl = document.createElement('div');
      fileEl.className = 'tree-file';

      const row = document.createElement('div');
      row.className = `tree-row ${activeFileId === node.id ? 'active' : ''}`;
      row.style.paddingLeft = `${12 + depth * 16 + 14}px`;
      row.dataset.fileId = node.id;

      const iconHtml = isSkillFile ? ICONS.skill : ICONS.file;
      row.innerHTML = iconHtml;
      const lbl = document.createElement('span');
      lbl.className = 'tree-label';
      lbl.textContent = node.label;
      row.appendChild(lbl);

      row.addEventListener('click', () => openFile(node.id));

      fileEl.appendChild(row);
      container.appendChild(fileEl);
    }
  });

  return container;
}

function rebuildTree(nodes) {
  const treeEl = document.getElementById('tree');
  treeEl.innerHTML = '';
  treeEl.appendChild(renderTree(nodes));
}

// ─── Markdown renderer ───────────────────────────────────────────────────────
function renderMarkdown(md) {
  // Escape raw HTML to prevent injection
  const escape = s => s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Inline formatting: bold, italic, inline code
  const inline = s => s
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');

  const lines = md.split('\n');
  const output = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // H2
    if (/^## /.test(line)) {
      output.push(`<h2>${inline(escape(line.slice(3).trim()))}</h2>`);
      i++; continue;
    }

    // H3
    if (/^### /.test(line)) {
      output.push(`<h3>${inline(escape(line.slice(4).trim()))}</h3>`);
      i++; continue;
    }

    // Fenced block (```lang). ```stats, ```bars and ```compare hold JSON and render
    // as rich blocks; ```wrap is a code block that wraps long lines; anything else is code.
    if (/^```/.test(line)) {
      const lang = line.slice(3).trim();
      i++; // skip opening fence
      const rawLines = [];
      while (i < lines.length && !/^```/.test(lines[i])) {
        rawLines.push(lines[i]);
        i++;
      }
      i++; // skip closing fence
      const block = renderRichBlock(lang, rawLines.join('\n'), s => inline(escape(String(s ?? ''))));
      if (block) { output.push(block); continue; }
      const cls = lang === 'wrap' ? ' class="pre-wrap"' : '';
      output.push(`<pre${cls}><code>${rawLines.map(escape).join('\n')}</code></pre>`);
      continue;
    }

    // Blockquote — collect consecutive > lines
    if (/^> /.test(line)) {
      const bqLines = [];
      while (i < lines.length && /^> /.test(lines[i])) {
        bqLines.push(inline(escape(lines[i].slice(2))));
        i++;
      }
      output.push(`<blockquote>${bqLines.join('<br>')}</blockquote>`);
      continue;
    }

    // Image on its own line: ![alt](path =width)
    const imgMatch = line.match(/^!\[([^\]]*)\]\(([^)\s]+)(?: =(\d+))?\)$/);
    if (imgMatch) {
      const [, alt, src, width] = imgMatch;
      output.push(`<img src="${escape(src)}" alt="${escape(alt)}" style="${width ? `width:${width}px;` : ''}max-width:100%;display:block;margin-bottom:24px;" />`);
      i++; continue;
    }

    // Blank line — skip
    if (line.trim() === '') { i++; continue; }

    // Table — detect by | characters
    if (/^\|/.test(line)) {
      const tableLines = [];
      while (i < lines.length && /^\|/.test(lines[i])) {
        tableLines.push(lines[i]);
        i++;
      }
      // filter out separator rows (---|---)
      const rows = tableLines.filter(l => !/^\|[-| :]+\|$/.test(l));
      if (rows.length > 0) {
        const parseRow = l => l.split('|').slice(1, -1).map(c => inline(escape(c.trim())));
        const [headerRow, ...bodyRows] = rows;
        const headers = parseRow(headerRow);
        const thead = `<thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>`;
        const tbody = bodyRows.map(r => `<tr>${parseRow(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
        output.push(`<table>${thead}<tbody>${tbody}</tbody></table>`);
      }
      continue;
    }

    // Ordered list
    if (/^\d+\. /.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\. /.test(lines[i])) {
        items.push(`<li>${inline(escape(lines[i].replace(/^\d+\. /, '')))}</li>`);
        i++;
      }
      output.push(`<ol>${items.join('')}</ol>`);
      continue;
    }

    // Unordered list — handles * and - , with one level of indented nesting (4-space or tab)
    if (/^[*-] /.test(line)) {
      const buildList = (indent) => {
        const items = [];
        while (i < lines.length) {
          const l = lines[i];
          const topLevel = /^[*-] /.test(l) && !l.startsWith('    ') && !l.startsWith('\t');
          const nested   = /^(    |\t)[*-] /.test(l);
          if (indent === 0 && topLevel) {
            // peek ahead for nested children
            const text = l.replace(/^[*-] /, '');
            i++;
            // collect nested items that immediately follow
            if (i < lines.length && /^(    |\t)[*-] /.test(lines[i])) {
              const sub = buildList(1);
              items.push(`<li>${inline(escape(text))}${sub}</li>`);
            } else {
              items.push(`<li>${inline(escape(text))}</li>`);
            }
          } else if (indent === 1 && nested) {
            const text = l.replace(/^(    |\t)[*-] /, '');
            items.push(`<li>${inline(escape(text))}</li>`);
            i++;
          } else {
            break;
          }
        }
        return `<ul>${items.join('')}</ul>`;
      };
      output.push(buildList(0));
      continue;
    }

    // Paragraph — collect consecutive non-special lines
    const paraLines = [];
    while (
      i < lines.length &&
      lines[i].trim() !== '' &&
      !/^#{2,3} /.test(lines[i]) &&
      !/^> /.test(lines[i]) &&
      !/^[*-] /.test(lines[i])
    ) {
      paraLines.push(inline(escape(lines[i])));
      i++;
    }
    if (paraLines.length) output.push(`<p>${paraLines.join('<br>')}</p>`);
  }

  return output.join('\n');
}


// ─── Rich blocks ─────────────────────────────────────────────────────────────
// Fenced JSON blocks in a page body:
//   ```stats    [{ "label", "value", "note" }, ...]
//   ```bars     { "series": [3 names], "rows": [{ "label", "n", "values": [3 counts] }],
//                 "caption", "label_header", "counts_header", "net": true, "size": "large" }
//   ```compare  { "label", "prompt", "answers": [{ "who", "series", "text", "pick" }], "note" }
// `fmt` escapes text and applies inline markdown. Returns null for unknown or invalid blocks.
function renderRichBlock(kind, json, fmt) {
  if (!['stats', 'bars', 'compare'].includes(kind)) return null;
  let data;
  try { data = JSON.parse(json); } catch (e) {
    console.warn(`Invalid ${kind} block:`, e);
    return null;
  }
  const attr = s => String(s ?? '')
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const pct = (v, n) => Math.round(100 * v / n);

  if (kind === 'stats') {
    return `<div class="rb-stats">${data.map(t => `
      <div class="rb-stat">
        <div class="rb-label-mono">${fmt(t.label)}</div>
        <div class="rb-stat-value">${fmt(t.value)}</div>
        <div class="rb-stat-note">${fmt(t.note)}</div>
      </div>`).join('')}
    </div>`;
  }

  if (kind === 'bars') {
    const series = data.series || [];
    const segs = row => row.values.map((v, k) => v
      ? `<span class="rb-seg s${k}" style="flex:${v}" title="${attr(`${row.label}: ${series[k]} ${v} of ${row.n} (${pct(v, row.n)}%)`)}"></span>`
      : '').join('');
    const describe = row => `${row.label}, ${row.n} prompts: ` +
      row.values.map((v, k) => `${series[k]} ${v}`).join(', ');
    const caption = data.caption ? `<div class="rb-caption">${fmt(data.caption)}</div>` : '';

    if (data.size === 'large') {
      const row = data.rows[0];
      const labels = row.values.map((v, k) =>
        `<div style="flex:${v}"><b>${v}</b>${fmt(series[k])} (${pct(v, row.n)}%)</div>`).join('');
      return `<figure class="rb-bars rb-large" role="img" aria-label="${attr(describe(row))}">
        ${caption}
        <div class="rb-bar">${segs(row)}</div>
        <div class="rb-large-labels" aria-hidden="true">${labels}</div>
      </figure>`;
    }

    const rowCls = data.net ? 'rb-row' : 'rb-row no-net';
    const legend = `<div class="rb-legend">${series.map((s, k) =>
      `<span><i class="rb-key s${k}"></i>${fmt(s)}</span>`).join('')}</div>`;
    const head = `<div class="${rowCls} rb-head" aria-hidden="true">
        <span>${fmt(data.label_header)}</span><span></span>
        <span class="rb-num">${fmt(data.counts_header)}</span>
        ${data.net ? '<span class="rb-num">Net</span>' : ''}
      </div>`;
    const rows = data.rows.map(row => {
      const net = row.values[row.values.length - 1] - row.values[0];
      return `<div class="${rowCls}" role="img" aria-label="${attr(describe(row))}">
        <span class="rb-name">${fmt(row.label)} <em>${row.n}</em></span>
        <span class="rb-bar">${segs(row)}</span>
        <span class="rb-num">${row.values.join(' / ')}</span>
        ${data.net ? `<span class="rb-num rb-net">${net > 0 ? '+' : ''}${net}</span>` : ''}
      </div>`;
    }).join('');
    return `<figure class="rb-bars">${caption}${legend}${head}${rows}</figure>`;
  }

  // compare
  const answers = (data.answers || []).map(a => `
    <div class="rb-answer">
      <div class="rb-who">
        <i class="rb-key s${a.series ?? 1}"></i><strong>${fmt(a.who)}</strong>
        ${a.pick ? `<span class="rb-pick">${fmt(a.pick)}</span>` : ''}
      </div>
      <div>${fmt(a.text)}</div>
    </div>`).join('');
  return `<div class="rb-compare">
    <div class="rb-compare-head">
      <div class="rb-label-mono">${fmt(data.label)}</div>
      <div class="rb-prompt">${fmt(data.prompt)}</div>
    </div>
    <div class="rb-answers">${answers}</div>
    ${data.note ? `<div class="rb-compare-note">${fmt(data.note)}</div>` : ''}
  </div>`;
}


// ─── Carousel ────────────────────────────────────────────────────────────────
function renderCarousel(container, images) {
  let current = 0;

  const slides = images.map((src, idx) => `
    <div class="carousel-slide ${idx === 0 ? 'active' : ''}">
      <img src="${src}" alt="Project image ${idx + 1}" loading="lazy" />
    </div>`).join('');

  const dots = images.map((_, idx) => `
    <button class="carousel-dot ${idx === 0 ? 'active' : ''}" data-idx="${idx}" aria-label="Go to image ${idx + 1}"></button>
  `).join('');

  container.innerHTML = `
    <div class="project-carousel">
      <div class="carousel-track-wrap">
        ${slides}
        <button class="carousel-btn prev" aria-label="Previous image">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button class="carousel-btn next" aria-label="Next image">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
      <div class="carousel-dots">${dots}</div>
      <div class="carousel-counter">${current + 1} / ${images.length}</div>
    </div>`;

  const slideEls = container.querySelectorAll('.carousel-slide');
  const dotEls   = container.querySelectorAll('.carousel-dot');
  const counter  = container.querySelector('.carousel-counter');

  function goTo(idx) {
    slideEls[current].classList.remove('active');
    dotEls[current].classList.remove('active');
    current = (idx + images.length) % images.length;
    slideEls[current].classList.add('active');
    dotEls[current].classList.add('active');
    counter.textContent = `${current + 1} / ${images.length}`;
  }

  container.querySelector('.prev').addEventListener('click', () => goTo(current - 1));
  container.querySelector('.next').addEventListener('click', () => goTo(current + 1));
  dotEls.forEach(dot => dot.addEventListener('click', () => goTo(+dot.dataset.idx)));

  // Keyboard navigation when content pane is focused
  container.closest('#content').addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });
}


// ─── Open file ───────────────────────────────────────────────────────────────
function openFile(id) {
  activeFileId = id;

  // Find file in flat list
  const fileData = allFiles.find(f => f.id === id);
  if (!fileData) return;

  // Update active state in tree
  document.querySelectorAll('.tree-row').forEach(r => r.classList.remove('active'));
  const activeRow = document.querySelector(`.tree-row[data-file-id="${id}"]`);
  if (activeRow) activeRow.classList.add('active');

  // Build breadcrumb
  const crumbs = [...fileData.breadcrumb, fileData.label];
  document.getElementById('project-breadcrumb').innerHTML =
    crumbs.map((c, i) => i < crumbs.length - 1
      ? `<span>${c}</span><span class="crumb-sep">/</span>`
      : `<span style="color:var(--text-muted)">${c}</span>`
    ).join('');

  // Skill badge
  const badgeContainer = document.getElementById('skill-badge-container');
  if (id.startsWith('skill-')) {
    badgeContainer.innerHTML = `<div class="skill-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
      </svg>
      SKILL.md
    </div>`;
  } else {
    badgeContainer.innerHTML = '';
  }

  const c = fileData.content;
  document.getElementById('project-title').textContent = c.title;
  document.getElementById('project-subtitle').textContent = c.subtitle;

  // Show project view immediately so all child elements are in a visible DOM
  // tree — required for renderCarousel's container.closest('#content') to resolve
  document.getElementById('welcome').style.display = 'none';
  const pv = document.getElementById('project-view');
  pv.style.display = 'block';

  // Tags
  const tagsEl = document.getElementById('project-tags');
  tagsEl.innerHTML = (c.tags || []).map(t => `<span class="project-tag">${t}</span>`).join('');

  // Body
  document.getElementById('project-body').innerHTML = renderMarkdown(c.body || '');

  // Script block (fixed-height scrollable box, shown only when spec has a 'script' field)
  const scriptContainer = document.getElementById('project-script-container');
  if (c.script) {
    scriptContainer.innerHTML = `
      <div class="project-script-wrap">
        <div class="project-script-label">Script</div>
        <div class="project-script">${c.script.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      </div>`;
  } else {
    scriptContainer.innerHTML = '';
  }

  // Images — carousel if > 1, single image if 1, hidden if none
  // SVGs get full-width treatment (no fixed aspect-ratio box)
  const imagesEl = document.getElementById('project-images');
  const imgs = c.images || [];
  if (imgs.length === 0) {
    imagesEl.innerHTML = '';
  } else if (imgs.length === 1) {
    if (imgs[0].endsWith('.svg')) {
      imagesEl.innerHTML = `<div style="overflow-x:auto;width:100%;"><img src="${imgs[0]}" alt="" loading="lazy" style="min-width:600px;width:100%;display:block;border-radius:8px;" /></div>`;
    } else {
      imagesEl.innerHTML = `<img src="${imgs[0]}" alt="" loading="lazy" style="max-width:100%;border-radius:8px;border:1px solid var(--border);" />`;
    }
  } else {
    renderCarousel(imagesEl, imgs);
  }

  // Body after carousel
  document.getElementById('project-body-after').innerHTML = renderMarkdown(c.body_after || '');

  // Sections — each has { body, images[] } rendered inline, one after another
  const sectionsEl = document.getElementById('project-sections');
  sectionsEl.innerHTML = '';
  if (c.sections && c.sections.length) {
    c.sections.forEach(sec => {
      const secDiv = document.createElement('div');
      secDiv.style.marginTop = '32px';
      if (sec.body) {
        const bodyDiv = document.createElement('div');
        bodyDiv.className = 'project-body';
        bodyDiv.innerHTML = renderMarkdown(sec.body);
        secDiv.appendChild(bodyDiv);
      }
      if (sec.images && sec.images.length) {
        const imgDiv = document.createElement('div');
        imgDiv.className = 'project-images';
        secDiv.appendChild(imgDiv);
        // Append secDiv to DOM *before* renderCarousel so closest('#content') resolves
        sectionsEl.appendChild(secDiv);
        if (sec.images.length === 1) {
          imgDiv.innerHTML = `<img src="${sec.images[0]}" alt="" loading="lazy" style="max-width:100%;border-radius:8px;border:1px solid var(--border);" />`;
        } else {
          renderCarousel(imgDiv, sec.images);
        }
      } else {
        sectionsEl.appendChild(secDiv);
      }
    });
  }

  // Build TOC from rendered headings
  buildToc();

  // Scroll content to top
  document.getElementById('content').scrollTop = 0;

  // On mobile: close the drawer after selecting a file
  if (window.innerWidth < 600) closeMobileDrawer();
}

// ─── Table of Contents ───────────────────────────────────────────────────────
function buildToc() {
  const tocPane  = document.getElementById('toc-pane');
  const tocList  = document.getElementById('toc-list');
  const bodyEl   = document.getElementById('project-body');
  const contentEl = document.getElementById('content');
  const app      = document.getElementById('app');

  // Remove any previous scroll listener
  if (contentEl._tocScrollHandler) {
    contentEl.removeEventListener('scroll', contentEl._tocScrollHandler);
    contentEl._tocScrollHandler = null;
  }

  // Collect h2 / h3 headings from all body sections
  const bodyAfterEl  = document.getElementById('project-body-after');
  const sectionsEl2  = document.getElementById('project-sections');
  const headings = [
    ...Array.from(bodyEl.querySelectorAll('h2, h3')),
    ...Array.from(bodyAfterEl.querySelectorAll('h2, h3')),
    ...Array.from(sectionsEl2.querySelectorAll('h2, h3'))
  ];

  if (headings.length === 0) {
    tocPane.style.display = 'none';
    app.classList.remove('has-toc');
    tocList.innerHTML = '';
    return;
  }

  // Stamp IDs on each heading so anchor links work
  headings.forEach((h, i) => {
    if (!h.id) {
      h.id = 'toc-' + h.textContent.trim().toLowerCase()
               .replace(/[^a-z0-9]+/g, '-')
               .replace(/^-|-$/g, '') + '-' + i;
    }
  });

  // Build list items
  tocList.innerHTML = headings.map(h => {
    const isH3 = h.tagName === 'H3';
    return `<li class="toc-item ${isH3 ? 'toc-h3' : ''}" data-toc-id="${h.id}">` +
           `<a href="#${h.id}">${h.textContent.trim()}</a></li>`;
  }).join('');

  // Show the pane — must set an explicit value; unsetting leaves CSS 'display:none' in effect
  tocPane.style.display = 'block';
  app.classList.add('has-toc');

  // Smooth-scroll inside #content (the actual scrollable container)
  tocList.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const targetId = a.getAttribute('href').slice(1);
      const target = document.getElementById(targetId);
      if (!target) return;
      // Get the heading's position relative to #content's scroll origin
      const contentTop = contentEl.getBoundingClientRect().top;
      const targetTop  = target.getBoundingClientRect().top;
      contentEl.scrollBy({ top: targetTop - contentTop - 16, behavior: 'smooth' });
    });
  });

  // Scroll-spy: highlight whichever heading is nearest the top of the viewport
  // Strategy: on every scroll event, find the last heading whose top <= 30% of #content height
  function updateActiveTocItem() {
    const threshold = contentEl.getBoundingClientRect().top + contentEl.clientHeight * 0.25;
    let active = null;
    headings.forEach(h => {
      if (h.getBoundingClientRect().top <= threshold) active = h;
    });
    tocList.querySelectorAll('.toc-item').forEach(item => {
      item.classList.toggle('active', active && item.dataset.tocId === active.id);
    });
  }

  // Run once immediately to set the initial active state
  updateActiveTocItem();

  // Re-run on scroll
  contentEl.addEventListener('scroll', updateActiveTocItem);
  // Store cleanup ref on the element so we can remove it when the file changes
  contentEl._tocScrollHandler = updateActiveTocItem;
}

// ─── Search ──────────────────────────────────────────────────────────────────
function handleSearch(query) {
  const treeEl = document.getElementById('tree');
  treeEl.innerHTML = '';

  if (!query.trim()) {
    treeEl.appendChild(renderTree(spec.tree));
    return;
  }

  const q = query.toLowerCase();
  const matches = allFiles.filter(f =>
    f.label.toLowerCase().includes(q) ||
    (f.content && f.content.body && f.content.body.toLowerCase().includes(q))
  );

  if (matches.length === 0) {
    treeEl.innerHTML = '<div class="no-results">No results found</div>';
    return;
  }

  matches.forEach(file => {
    const row = document.createElement('div');
    row.className = `tree-row ${activeFileId === file.id ? 'active' : ''}`;
    row.style.paddingLeft = '12px';
    row.dataset.fileId = file.id;

    const iconHtml = file.id.startsWith('skill-') ? ICONS.skill : ICONS.file;
    row.innerHTML = iconHtml;
    const lbl = document.createElement('span');
    lbl.className = 'tree-label';
    lbl.textContent = file.label;
    row.appendChild(lbl);

    row.addEventListener('click', () => openFile(file.id));
    treeEl.appendChild(row);
  });
}

// ─── Mobile drawer ────────────────────────────────────────────────────────────
function openMobileDrawer() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeMobileDrawer() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
  document.body.style.overflow = '';
}

function initMobile() {
  document.getElementById('hamburger').addEventListener('click', openMobileDrawer);
  document.getElementById('overlay').addEventListener('click', closeMobileDrawer);
  document.getElementById('back-btn').addEventListener('click', () => {
    // Return to welcome screen and close project view
    document.getElementById('project-view').style.display = 'none';
    document.getElementById('welcome').style.display = 'flex';
    document.getElementById('content').scrollTop = 0;
    // Hide TOC and remove scroll listener
    document.getElementById('toc-pane').style.display = 'none';
    document.getElementById('app').classList.remove('has-toc');
    const ce = document.getElementById('content');
    if (ce._tocScrollHandler) {
      ce.removeEventListener('scroll', ce._tocScrollHandler);
      ce._tocScrollHandler = null;
    }
    // Clear active state
    activeFileId = null;
    document.querySelectorAll('.tree-row').forEach(r => r.classList.remove('active'));
  });
}

// ─── Sidebar resize ────────────────────────────────────────────────────────────
function initResize() {
  const handle = document.getElementById('resize-handle');
  const sidebar = document.getElementById('sidebar');
  let dragging = false;
  let startX = 0;
  let startW = 0;

  handle.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const delta = e.clientX - startX;
    const newW = Math.max(180, Math.min(480, startW + delta));
    sidebar.style.width = newW + 'px';
    sidebar.style.minWidth = newW + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  spec = await loadSpec();
  if (!spec) {
    document.getElementById('tree').innerHTML =
      '<div class="no-results">Error: spec.json not found</div>';
    return;
  }

  // Meta
  document.title = spec.meta.name + ' — Portfolio';
  document.getElementById('meta-name').textContent = spec.meta.name;
  document.getElementById('meta-title').textContent = spec.meta.title;
  document.getElementById('welcome-name').textContent = spec.meta.name;
  document.getElementById('welcome-tagline').textContent = spec.meta.tagline;

  // Flatten for search, open top-level folders by default
  flattenTree(spec.tree);
  spec.tree.forEach(node => {
    if (node.type === 'folder') openFolders.add(node.id);
  });

  // Render
  rebuildTree(spec.tree);
  renderFeatured(spec.meta.featured);
  initResize();
  initMobile();

  // Search
  document.getElementById('search-input').addEventListener('input', e => {
    handleSearch(e.target.value);
  });

  // Theme toggle
  initTheme();
}

// ─── Theme ────────────────────────────────────────────────────────────────────
const ICON_MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>`;
const ICON_SUN  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;

function setTheme(isLight) {
  const root = document.documentElement;
  // Update both toggles (desktop sidebar + mobile bar)
  [document.getElementById('theme-toggle'),
   document.getElementById('mobile-theme-toggle')].forEach(btn => {
    if (!btn) return;
    btn.innerHTML = isLight ? ICON_MOON : ICON_SUN;
    btn.title = isLight ? 'Switch to dark mode' : 'Switch to light mode';
  });
  if (isLight) {
    root.classList.add('light');
  } else {
    root.classList.remove('light');
  }
  localStorage.setItem('portfolio-theme', isLight ? 'light' : 'dark');
}

function initTheme() {
  const saved = localStorage.getItem('portfolio-theme');
  const preferLight = saved === 'light' ||
    (!saved && window.matchMedia('(prefers-color-scheme: light)').matches);
  setTheme(preferLight);

  // Wire both toggles to the same handler
  ['theme-toggle', 'mobile-theme-toggle'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.addEventListener('click', () => {
      setTheme(!document.documentElement.classList.contains('light'));
    });
  });
}

init();
